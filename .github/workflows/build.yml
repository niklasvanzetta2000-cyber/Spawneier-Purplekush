   name: Build Plugin

   on:
     push:
     pull_request:
     workflow_dispatch:

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4

         - name: Java einrichten
           uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: '25'
             cache: maven

         - name: Bauen
           run: mvn -B clean package

         - name: JAR hochladen
           uses: actions/upload-artifact@v4
           with:
             name: SpawnEier-PurpleKush
             path: target/*.jar
